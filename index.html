function getDeviceId(){
  const KEY = 'cyArtwalkDeviceId';
  let id = localStorage.getItem(KEY);
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : 'dev-' + Date.now() + '-' + Math.random().toString(16).slice(2));
    localStorage.setItem(KEY, id);
  }
  return id;
}
const deviceId = getDeviceId();

function saveProgress(){
  if(!db) return;
  db.collection('visitors').doc(deviceId).set({
    collected: Array.from(collected),

  }, {merge:true}).catch(err=> console.warn('雲端同步失敗（不影響本機集點）：', err));
}

async function loadProgress(){
  if(!db) return [];

    const snap = await db.collection('visitors').doc(deviceId).get();

  }catch(err){

const TOTAL = SPOTS.length;

/* ===================== 狀態（純前端 Demo：重整頁面即清空，不接資料庫） ===================== */
let collected = new Set();

/* ===================== 產生站點覆蓋層 =====================
   每個站點疊一塊「同一張海報圖、但套灰階濾鏡」的遮罩，
   用 background-position 精準對齊到該站點在整張圖上的位置，
   集點前顯示灰霧遮罩、集點後淡出露出原本全彩照片。
*/
const CANVAS_W = 1400;               // 對應 #poster 的顯示寬度（見 CSS）
const CANVAS_H = CANVAS_W * (5031/3579); // 依海報原始比例換算顯示高度

const spotsLayer = document.getElementById('spots');
SPOTS.forEach(s=>{
  const el = document.createElement('div');
  el.className = 'spot';
  el.id = 'spot-'+s.id;
  el.style.left = s.left+'%';
  el.style.top = s.top+'%';
  el.style.width = s.w+'%';
  el.style.height = s.h+'%';

  const reveal = document.createElement('img');
  reveal.className = 'reveal-img';
  reveal.alt = s.name;
  reveal.dataset.src = 'photos/' + String(s.id).padStart(2,'0') + '.jpg';
  el.appendChild(reveal);

  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.style.backgroundImage = "url('map-fog.jpg')";
  mask.style.backgroundSize = CANVAS_W+'px '+CANVAS_H+'px';
  mask.style.backgroundPosition = (-(s.left/100*CANVAS_W))+'px '+(-(s.top/100*CANVAS_H))+'px';
  el.appendChild(mask);

  const badge = document.createElement('div');
  badge.className = 'badge';
  badge.innerHTML = '<svg viewBox="0 0 64 64" width="100%" height="100%"><circle cx="32" cy="32" r="29" fill="#17151a" stroke="#ffd76a" stroke-width="4"/><path d="M19 33l8 8 17-19" fill="none" stroke="#ffd76a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  el.appendChild(badge);

  const zoomHint = document.createElement('div');
  zoomHint.className = 'zoom-hint';
  zoomHint.innerHTML = '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none"><circle cx="10" cy="10" r="6.5" stroke="#ffd76a" stroke-width="2"/><path d="M14.5 14.5L20 20" stroke="#ffd76a" stroke-width="2" stroke-linecap="round"/><path d="M10 7.5v5M7.5 10h5" stroke="#ffd76a" stroke-width="1.6" stroke-linecap="round"/></svg>';
  el.appendChild(zoomHint);

  el.addEventListener('click', ()=>{
    if(suppressClick) return;
    if(collected.has(s.id)){
      openLightbox(s);
    } else {
      openInfo(s);
    }
  });

  spotsLayer.appendChild(el);
});

function updateProgress(){
  document.getElementById('count-num').textContent = collected.size;
  const ring = document.getElementById('ring-fg');
  const circumference = 97.4;
  const offset = circumference - (collected.size/TOTAL)*circumference;
  ring.style.strokeDashoffset = offset;
  if(collected.size >= TOTAL){
    setTimeout(()=> document.getElementById('reward').classList.add('show'), 500);
  }
}

let toastTimer = null;
function showToast(name){
  const t = document.getElementById('toast');
  document.getElementById('toast-title').textContent = '集點成功！';
  document.getElementById('toast-sub').textContent = name;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2400);
}

function markCollected(id, {silent=false, focus=false} = {}){
  const spot = SPOTS.find(s=>s.id===id);
  if(!spot) return false;
  const el = document.getElementById('spot-'+id);
  const already = collected.has(id);
  collected.add(id);
  if(el){
    el.classList.add('collected');
    const revealEl = el.querySelector('.reveal-img');
    if(revealEl && !revealEl.src) revealEl.src = revealEl.dataset.src;
  }
  updateProgress();
  if(!already && !silent) showToast(spot.name);
  if(focus && el) focusOnSpot(spot);
  return !already;
}

/* ===================== 從網址參數判斷本次掃到哪個地點 =====================
   例如： https://yourdomain/?loc=05  →  第 5 號站點亮起
   （22 個地點各自對應一組 QR code 網址，?loc= 後面接 1~22）
*/
function handleIncomingURL(){
  const params = new URLSearchParams(location.search);
  const loc = params.get('loc');
  if(loc){
    const id = parseInt(loc, 10);
    if(id >= 1 && id <= TOTAL){
      const isNew = markCollected(id, {focus:true});
      if(isNew) saveProgress();
    }
  }
}

/* ===================== 縮放平移（手機優化：雙指縮放、拖曳、雙擊、滾輪） ===================== */
const wrap = document.getElementById('stage-wrap');
const stage = document.getElementById('stage');
const poster = document.getElementById('poster');

let scale = 1, minScale = 1, maxScale = 6;
let tx = 0, ty = 0;

function applyTransform(){
  stage.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${scale})`;
}

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

let reservedTop = 0, reservedBottom = 0;
function measureReserved(){
  const topbarH = document.getElementById('topbar').getBoundingClientRect().height;
  const rulesH = document.getElementById('rules-banner').getBoundingClientRect().height;
  const bottomH = document.getElementById('bottombar').getBoundingClientRect().height;
  reservedTop = topbarH + rulesH + 10;
  reservedBottom = bottomH + 10;
}

function constrain(){
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  const pw = poster.clientWidth * scale, ph = poster.clientHeight * scale;
  const availH = Math.max(120, wh - reservedTop - reservedBottom);
  if(pw <= ww){ tx = (ww - pw)/2; } else { tx = clamp(tx, ww - pw, 0); }
  if(ph <= availH){
    ty = reservedTop + (availH - ph)/2;
  } else {
    ty = clamp(ty, wh - reservedBottom - ph, reservedTop);
  }
}

function fitToScreen(){
  measureReserved();
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  const iw = poster.naturalWidth, ih = poster.naturalHeight;
  const displayW = poster.clientWidth || 1400;
  const displayH = displayW * (ih/iw);
  const availH = Math.max(120, wh - reservedTop - reservedBottom);

  const scaleToFitW = ww / displayW;
  const scaleToFitH = availH / displayH;
  minScale = Math.min(scaleToFitW, scaleToFitH);
  scale = minScale;
  tx = (ww - displayW*scale)/2;
  ty = reservedTop + (availH - displayH*scale)/2;
  applyTransform();
}

function focusOnSpot(spot){
  stopMomentum();
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  const displayW = poster.clientWidth;
  const displayH = displayW * (poster.naturalHeight/poster.naturalWidth);
  const targetScale = clamp(2.4, minScale, maxScale);
  const cx = (spot.left + spot.w/2)/100 * displayW;
  const cy = (spot.top + spot.h/2)/100 * displayH;
  scale = targetScale;
  tx = ww/2 - cx*scale;
  ty = wh/2 - cy*scale;
  constrain();
  stage.style.transition = 'transform .55s cubic-bezier(.2,.8,.2,1)';
  applyTransform();
  setTimeout(()=>{ stage.style.transition = ''; }, 600);
}

async function bootApp(){
  const existing = await loadProgress();
  existing.forEach(id => markCollected(id, {silent:true}));
  handleIncomingURL();
}

window.addEventListener('load', ()=>{
  if(poster.complete){ fitToScreen(); bootApp(); }
  else poster.onload = ()=>{ fitToScreen(); bootApp(); };
});
window.addEventListener('resize', fitToScreen);

/* ---- 縮放平移：手機用原生 Touch Events（比 Pointer Events 在 iOS 多指手勢更穩定可靠），
   桌機另外用 Mouse Events + 滾輪 ---- */
let dragging = false, dragStart = null;
let downPoint = null, suppressClick = false;
let rafPending = false;
function scheduleRender(){
  if(!rafPending){
    rafPending = true;
    requestAnimationFrame(()=>{ applyTransform(); rafPending = false; });
  }
}
let moveHistory = [];
let momentumRAF = null;
function stopMomentum(){
  if(momentumRAF){ cancelAnimationFrame(momentumRAF); momentumRAF = null; }
}
function startMomentum(vx, vy){
  stopMomentum();
  let lastT = performance.now();
  function step(now){
    const dt = Math.min(32, now - lastT);
    lastT = now;
    tx += vx * dt;
    ty += vy * dt;
    const friction = Math.pow(0.0025, dt/1000);
    vx *= friction; vy *= friction;
    constrain();
    applyTransform();
    if(Math.hypot(vx,vy) > 0.02){
      momentumRAF = requestAnimationFrame(step);
    } else {
      momentumRAF = null;
    }
  }
  momentumRAF = requestAnimationFrame(step);
}
function dist(p1,p2){ return Math.hypot(p1.x-p2.x, p1.y-p2.y); }
function mid(p1,p2){ return {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2}; }
function trackMove(x,y){
  const now = performance.now();
  moveHistory.push({x,y,t:now});
  while(moveHistory.length > 2 && now - moveHistory[0].t > 80){ moveHistory.shift(); }
}
function releaseMomentum(){
  if(moveHistory.length >= 2){
    const first = moveHistory[0], last = moveHistory[moveHistory.length-1];
    const dt = last.t - first.t;
    if(dt > 0 && dt < 200){
      const vx = (last.x-first.x)/dt, vy = (last.y-first.y)/dt;
      if(Math.hypot(vx,vy) > 0.05) startMomentum(vx, vy);
    }
  }
}
function zoomAtPoint(newScaleRaw, localX, localY, animate){
  const newScale = clamp(newScaleRaw, minScale, maxScale);
  const worldX = (localX - tx)/scale, worldY = (localY - ty)/scale;
  tx = localX - worldX*newScale;
  ty = localY - worldY*newScale;
  scale = newScale;
  constrain();
  if(animate){
    stage.style.transition = 'transform .3s ease';
    applyTransform();
    setTimeout(()=> stage.style.transition = '', 320);
  } else {
    applyTransform();
  }
}

let lastDist = null;
let lastTapTime = 0, lastTapPos = null;

/* --- Touch (mobile) --- */
wrap.addEventListener('touchstart', e=>{
  stopMomentum();
  if(e.touches.length === 1){
    const t = e.touches[0];
    dragging = true;
    dragStart = {x:t.clientX - tx, y:t.clientY - ty};
    downPoint = {x:t.clientX, y:t.clientY};
    suppressClick = false;
    moveHistory = [{x:t.clientX, y:t.clientY, t:performance.now()}];
    lastDist = null;
  } else if(e.touches.length >= 2){
    dragging = false;
    suppressClick = true;
    const [t1,t2] = e.touches;
    lastDist = dist({x:t1.clientX,y:t1.clientY}, {x:t2.clientX,y:t2.clientY});
  }
}, {passive:true});

wrap.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(e.touches.length >= 2){
    const [t1,t2] = e.touches;
    const p1 = {x:t1.clientX,y:t1.clientY}, p2 = {x:t2.clientX,y:t2.clientY};
    const d = dist(p1,p2);
    const m = mid(p1,p2);
    if(lastDist){
      const factor = d / lastDist;
      const newScale = clamp(scale * factor, minScale, maxScale);
      const rect = wrap.getBoundingClientRect();
      const localX = m.x - rect.left, localY = m.y - rect.top;
      const worldX = (localX - tx)/scale, worldY = (localY - ty)/scale;
      tx = localX - worldX*newScale;
      ty = localY - worldY*newScale;
      scale = newScale;
      constrain();
      scheduleRender();
    }
    lastDist = d;
  } else if(e.touches.length === 1 && dragging){
    const t = e.touches[0];
    tx = t.clientX - dragStart.x;
    ty = t.clientY - dragStart.y;
    constrain();
    scheduleRender();
    if(downPoint && Math.hypot(t.clientX-downPoint.x, t.clientY-downPoint.y) > 6){
      suppressClick = true;
    }
    trackMove(t.clientX, t.clientY);
  }
}, {passive:false});

function touchEndHandler(e){
  const remaining = e.touches.length;
  if(remaining >= 2){
    const [t1,t2] = e.touches;
    lastDist = dist({x:t1.clientX,y:t1.clientY}, {x:t2.clientX,y:t2.clientY});
    dragging = false;
  } else if(remaining === 1){
    const t = e.touches[0];
    dragging = true;
    dragStart = {x:t.clientX - tx, y:t.clientY - ty};
    moveHistory = [{x:t.clientX, y:t.clientY, t:performance.now()}];
    lastDist = null;
  } else {
    if(dragging) releaseMomentum();
    dragging = false;
    lastDist = null;

    // double-tap to zoom（僅在單指輕點、非拖曳、非雙指縮放後觸發）
    if(!suppressClick && e.changedTouches.length === 1){
      const t = e.changedTouches[0];
      const now = Date.now();
      if(now - lastTapTime < 320 && lastTapPos && dist(lastTapPos,{x:t.clientX,y:t.clientY}) < 30){
        const rect = wrap.getBoundingClientRect();
        const localX = t.clientX - rect.left, localY = t.clientY - rect.top;
        const target = scale < (minScale*1.8) ? minScale*3 : minScale;
        zoomAtPoint(target, localX, localY, true);
        lastTapTime = 0;
      } else {
        lastTapTime = now;
        lastTapPos = {x:t.clientX, y:t.clientY};
      }
    }
  }
}
wrap.addEventListener('touchend', touchEndHandler, {passive:true});
wrap.addEventListener('touchcancel', touchEndHandler, {passive:true});

/* --- Mouse (desktop) --- */
wrap.addEventListener('mousedown', e=>{
  stopMomentum();
  dragging = true;
  dragStart = {x:e.clientX - tx, y:e.clientY - ty};
  downPoint = {x:e.clientX, y:e.clientY};
  suppressClick = false;
  moveHistory = [{x:e.clientX, y:e.clientY, t:performance.now()}];
});
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  tx = e.clientX - dragStart.x;
  ty = e.clientY - dragStart.y;
  constrain();
  scheduleRender();
  if(downPoint && Math.hypot(e.clientX-downPoint.x, e.clientY-downPoint.y) > 6){
    suppressClick = true;
  }
  trackMove(e.clientX, e.clientY);
});
window.addEventListener('mouseup', ()=>{
  if(dragging) releaseMomentum();
  dragging = false;
});
wrap.addEventListener('dblclick', e=>{
  const rect = wrap.getBoundingClientRect();
  const localX = e.clientX - rect.left, localY = e.clientY - rect.top;
  const target = scale < (minScale*1.8) ? minScale*3 : minScale;
  zoomAtPoint(target, localX, localY, true);
});

/* mouse wheel zoom (desktop) */
wrap.addEventListener('wheel', e=>{
  e.preventDefault();
  stopMomentum();
  const rect = wrap.getBoundingClientRect();
  const localX = e.clientX - rect.left, localY = e.clientY - rect.top;
  const delta = -e.deltaY * 0.0015;
  zoomAtPoint(scale * (1+delta), localX, localY, false);
}, {passive:false});

document.getElementById('zoom-in').addEventListener('click', ()=>{
  stopMomentum();
  const ww=wrap.clientWidth, wh=wrap.clientHeight;
  zoomAtPoint(scale*1.4, ww/2, wh/2, true);
});
document.getElementById('zoom-out').addEventListener('click', ()=>{
  stopMomentum();
  const ww=wrap.clientWidth, wh=wrap.clientHeight;
  zoomAtPoint(scale/1.4, ww/2, wh/2, true);
});
document.getElementById('zoom-reset').addEventListener('click', ()=>{
  stopMomentum();
  stage.style.transition='transform .35s ease';
  fitToScreen();
  setTimeout(()=>stage.style.transition='',360);
});

document.getElementById('reward-close').addEventListener('click', ()=>{
  document.getElementById('reward').classList.remove('show');
});

document.getElementById('rules-toggle').addEventListener('click', ()=>{
  document.getElementById('rules-banner').classList.toggle('expanded');
  setTimeout(measureReserved, 320);
});

setTimeout(()=>{ document.getElementById('hint').style.opacity = 0; }, 3800);
</script>
